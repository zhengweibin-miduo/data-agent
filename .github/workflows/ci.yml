name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-quality:
    name: frontend-quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20.19.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Run frontend typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Run frontend tests
        working-directory: frontend
        run: npm run test

      - name: Build independent frontend
        working-directory: frontend
        run: npm run build

  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: meta
          MYSQL_USER: data_agent
          MYSQL_PASSWORD: data_agent
        ports:
          - "3306:3306"
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
          --health-start-period=30s
      redis:
        image: redis:8.8.0
        ports:
          - "6379:6379"
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.15.5
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
        ports:
          - "9200:9200"
        options: >-
          --health-cmd="curl --fail http://localhost:9200/_cluster/health"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=30
          --health-start-period=30s

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Install Elasticsearch IK analyzer
        run: |
          docker exec "${{ job.services.elasticsearch.id }}" \
            bin/elasticsearch-plugin install --batch \
            https://get.infini.cloud/elasticsearch/analysis-ik/8.15.5
          docker restart "${{ job.services.elasticsearch.id }}"
          timeout 90 bash -c \
            'until curl --fail --silent http://localhost:9200/_cluster/health?wait_for_status=yellow; do sleep 2; done'

      - name: Initialize metadata database
        run: mysql -h 127.0.0.1 -uroot -proot < ../docs/docker/mysql/meta.sql

      - name: Initialize application memory database
        run: mysql -h 127.0.0.1 -uroot -proot < ../docs/docker/mysql/data_agent.sql

      - name: Initialize data sync database
        run: mysql -h 127.0.0.1 -uroot -proot < ../docs/docker/mysql/data_sync.sql

      - name: Initialize data sync source database
        run: mysql -h 127.0.0.1 -uroot -proot < ../docs/docker/mysql/source_demo.sql

      - name: Initialize data warehouse database
        run: mysql -h 127.0.0.1 -uroot -proot < ../docs/docker/mysql/dw.sql

      - name: Configure Redis durability
        run: |
          docker exec "${{ job.services.redis.id }}" redis-cli CONFIG SET appendonly yes
          docker exec "${{ job.services.redis.id }}" redis-cli CONFIG SET appendfsync everysec

      - name: Render Docker Compose configuration
        run: docker compose -f ../docs/docker/docker-compose.yml config

      - name: Check lock file
        run: uv lock --check

      - name: Run Ruff lint
        run: uv run ruff check src tests

      - name: Run Pyright
        run: uv run pyright src tests

      - name: Compile Python modules
        run: uv run python -m compileall -q src tests

      - name: Validate application configuration
        run: uv run python -m settings

      - name: Run pytest suite
        run: uv run pytest -m "not tei"

      - name: Build backend distribution
        run: uv build

      - name: Verify installed wheel boundary
        run: |
          uv venv "${RUNNER_TEMP}/data-agent-wheel-smoke"
          uv pip install --python "${RUNNER_TEMP}/data-agent-wheel-smoke/bin/python" dist/*.whl
          DATA_AGENT_CONFIG="${PWD}/conf/app_config.yaml" \
            "${RUNNER_TEMP}/data-agent-wheel-smoke/bin/python" \
            scripts/verify_installed_wheel.py dist/*.whl

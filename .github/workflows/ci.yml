name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: meta
          MYSQL_USER: data_agent
          MYSQL_PASSWORD: data_agent
        ports:
          - "3306:3306"
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
          --health-start-period=30s
      redis:
        image: redis:8.8.0
        ports:
          - "6379:6379"
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Initialize application memory database
        run: mysql -h 127.0.0.1 -uroot -proot < docs/docker/mysql/data_agent.sql

      - name: Configure Redis durability
        run: |
          redis-cli CONFIG SET appendonly yes
          redis-cli CONFIG SET appendfsync everysec

      - name: Check lock file
        run: uv lock --check

      - name: Run Ruff lint
        run: uv run ruff check src tests

      - name: Run Pyright
        run: uv run pyright src tests

      - name: Compile Python modules
        run: uv run python -m compileall -q src tests

      - name: Validate application configuration
        run: uv run python -m data_agent.settings

      - name: Run pytest suite
        run: uv run pytest -m "not tei"

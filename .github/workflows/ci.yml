name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: meta
          MYSQL_USER: data_agent
          MYSQL_PASSWORD: data_agent
        ports:
          - "3306:3306"
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
          --health-start-period=30s
      redis:
        image: redis:8.8.0
        ports:
          - "6379:6379"
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Initialize application memory database
        run: mysql -h 127.0.0.1 -uroot -proot < docs/docker/mysql/data_agent.sql

      - name: Check lock file
        run: uv lock --check

      - name: Run Ruff lint
        run: uv run --with ruff ruff check app app_test

      - name: Run Pyright
        run: uv run --with pyright pyright app app_test

      - name: Compile Python modules
        run: uv run python -m compileall -q app app_test main.py

      - name: Validate application configuration
        run: uv run python -m app.conf.app_config

      - name: Run core and client checks
        run: |
          uv run python -m app_test.core.test_logging
          uv run python -m app_test.client.test_mysql_client_manager
          uv run python -m app_test.client.test_redis_client_manager
          uv run python -m app_test.client.test_llm_client_manager

      - name: Run parser, validator, and graph checks
        run: |
          uv run python -m app_test.service.ddl_metadata.test_parser
          uv run python -m app_test.service.ddl_metadata.test_validator
          uv run python -m app_test.service.ddl_metadata.test_graph

      - name: Run repository and memory checks
        run: |
          uv run python -m app_test.repository.ddl_metadata.test_meta
          uv run python -m app_test.repository.ddl_metadata.test_memory
          uv run python -m app_test.service.ddl_metadata.test_memory

      - name: Run worker and API checks
        run: |
          uv run python -m app_test.worker.test_ddl_metadata
          uv run python -m app_test.api.test_ddl_metadata_api

      - name: Run DDL metadata integration flow
        run: uv run python -m app_test.integration.test_ddl_metadata_flow

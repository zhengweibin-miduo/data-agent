name: Delegate Missed Codex Review Threads

on:
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number（补发遗漏 thread，并自动 resolve Outdated thread）
        required: true
        type: number

concurrency:
  group: codex-review-resolution-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  delegate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.pull_request.draft != true &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        contains(
          format(',{0},', vars.PR_AUTHORS || 'zhengweibin-miduo,iuiiui,chatgpt-codex-connector[bot]'),
          format(',{0},', github.event.pull_request.user.login)
        ) &&
        contains(
          format(',{0},', vars.REVIEW_BOTS || 'chatgpt-codex-connector[bot]'),
          format(',{0},', github.event.review.user.login)
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      # 只检出默认分支上的受信任脚本，绝不执行 PR head 中的代码。
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Require user PAT
        env:
          CODEX_TRIGGER_TOKEN: ${{ secrets.CODEX_TRIGGER_TOKEN }}
        run: test -n "$CODEX_TRIGGER_TOKEN"

      - name: Resolve outdated Codex review threads
        if: github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v8
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_AUTHORS: ${{ vars.PR_AUTHORS }}
          REVIEW_BOTS: ${{ vars.REVIEW_BOTS }}
        with:
          github-token: ${{ github.token }}
          script: |
            const {
              resolveOutdatedReviewThreads,
            } = require('./.github/scripts/codex-review-delegation.js');
            await resolveOutdatedReviewThreads({
              github,
              context,
              core,
              prNumber: process.env.PR_NUMBER,
              prAuthors: process.env.PR_AUTHORS,
              reviewBots: process.env.REVIEW_BOTS,
            });

      - name: Delegate Codex review threads
        uses: actions/github-script@v8
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_AUTHORS: ${{ vars.PR_AUTHORS }}
          REVIEW_BOTS: ${{ vars.REVIEW_BOTS }}
        with:
          github-token: ${{ secrets.CODEX_TRIGGER_TOKEN }}
          script: |
            const {
              delegateManualReview,
              delegateReview,
            } = require('./.github/scripts/codex-review-delegation.js');
            if (context.eventName === 'workflow_dispatch') {
              await delegateManualReview({
                github,
                context,
                core,
                prNumber: process.env.PR_NUMBER,
                prAuthors: process.env.PR_AUTHORS,
                reviewBots: process.env.REVIEW_BOTS,
              });
            } else {
              await delegateReview({ github, context, core });
            }

name: Delegate Codex Review Resolution

on:
  pull_request_review:
    types: [submitted]

concurrency:
  group: codex-review-resolution-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  delegate:
    if: >-
      github.event.pull_request.draft != true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(
        format(',{0},', vars.PR_AUTHORS || 'zhengweibin-miduo,iuiiui,chatgpt-codex-connector[bot]'),
        format(',{0},', github.event.pull_request.user.login)
      ) &&
      contains(
        format(',{0},', vars.REVIEW_BOTS || 'chatgpt-codex-connector[bot]'),
        format(',{0},', github.event.review.user.login)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # 只检出默认分支上的受信任脚本，绝不执行 PR head 中的代码。
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Require user PAT
        env:
          CODEX_TRIGGER_TOKEN: ${{ secrets.CODEX_TRIGGER_TOKEN }}
        run: test -n "$CODEX_TRIGGER_TOKEN"

      - uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.CODEX_TRIGGER_TOKEN }}
          script: |
            const { delegateReview } = require('./.github/scripts/codex-review-delegation.js');
            await delegateReview({ github, context, core });

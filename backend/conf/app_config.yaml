logging:
  service_name: data-agent
  deployment_environment: local
  file:
    enable: true
    level: INFO
    format: json
    path: logs
    rotation: "10 MB"
    retention: "7 days"
  console:
    enable: true
    level: INFO
    format: text

qdrant:
  url: http://localhost:6333
  memory_collection: data_agent_memory
  metadata_collection: data_agent_metadata_semantic
  vector_size: 1024
  distance: Cosine
  top_k: 20
  timeout_seconds: 10

elasticsearch:
  url: http://localhost:9200
  memory_index: data_agent_memory
  metadata_value_index: data_agent_metadata_column_values
  analyzer: ik_max_word
  top_k: 20
  request_timeout_seconds: 10
  max_retries: 2

tei:
  url: http://localhost:8080
  vector_size: 1024
  request_timeout_seconds: 30

mysql:
  url: mysql+asyncmy://data_agent:data_agent@localhost:3306/meta?charset=utf8mb4
  generation_lock_pool_size: 16
  generation_lock_pool_timeout_seconds: 1

query:
  read_url: mysql+asyncmy://data_agent_query:data_agent_query@localhost:3306/dw?charset=utf8mb4
  timeout_seconds: 10
  fetch_batch_rows: 500
  max_batch_bytes: 1048576
  clarification_chain_message_limit: 100
  clarification_chain_max_chars: 262144

data_sync:
  database: data_sync
  dw_database: dw
  sources:
    source_demo:
      url: mysql+asyncmy://data_agent_replica:data_agent_replica@localhost:3306/source_demo?charset=utf8mb4
      server_id: 2001
  claim_lease_seconds: 60
  generation_lock_timeout_seconds: 10
  retry_base_seconds: 5
  retry_max_seconds: 300
  max_attempts: 10
  backfill_batch_size: 500
  backfill_interval_seconds: 0.1
  event_buffer_limit: 100000
  event_cleanup_batch_size: 1000
  poll_interval_seconds: 1
  source_connect_timeout_seconds: 5
  source_read_timeout_seconds: 30

api:
  host: 127.0.0.1
  port: 8000
  cors_origins:
    - http://127.0.0.1:5173
    - http://localhost:5173
  allow_remote_cors_origins: false
  max_ddl_bytes: 262144
  max_tables: 50
  max_columns: 500
  sse_heartbeat_seconds: 15

redis:
  url: redis://localhost:6379/0
  key_prefix: ddl
  socket_timeout_seconds: 30
  socket_connect_timeout_seconds: 5
  health_check_interval_seconds: 30
  checkpoint_retention_seconds: 86400
  result_retention_seconds: 86400
  event_stream_max_events: 256
  waiting_timeout_seconds: 1800
  worker_concurrency: 4
  worker_job_timeout_seconds: 600
  job_stall_grace_seconds: 120
  max_job_attempts: 3

llm:
  base_url: http://127.0.0.1:11434/v1
  model: local-model
  request_timeout_seconds: 60
  semantic_confidence_threshold: 0.75
  structured_output_method: json_schema
  max_concurrency: 4
  max_retries: 2
  prompt_version: v1
  graph_version: v1

memory:
  database: data_agent
  content_version: v1
  ddl_semantic_content_version: v1
  projection_version: v1
  source_lease_seconds: 3600
  rebuild_batch_size: 100
  outbox_batch_size: 100
  outbox_max_backoff_seconds: 3600
  outbox_claim_lease_seconds: 300
  outbox_max_attempts: 10
  retrieval_timeout_seconds: 2
  rrf_constant: 60
  search_limit: 20

metadata_index:
  projection_version: v1
  value_top_n: 10000
  value_scan_batch_size: 1000
  value_bulk_batch_size: 500
  dispatch_batch_size: 100
  claim_lease_seconds: 300
  retry_max_seconds: 3600
  max_attempts: 10
  debounce_seconds: 5
  search_limit: 20

conversation:
  max_message_chars: 32768
  context_message_limit: 20
  context_max_chars: 32768
  summary_max_chars: 4096
  extraction_batch_size: 10
  extraction_lease_seconds: 180
  turn_lease_seconds: 600

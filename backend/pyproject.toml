[project]
name = "data-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
# Windows compatibility: keep <3.14 until asyncmy ships a CPython 3.14 wheel,
# then lift this bound and regenerate uv.lock.
requires-python = ">=3.13,<3.14"
dependencies = [
    "arq>=0.28,<0.29",
    "asyncmy>=0.2.11",
    "cryptography>=49.0.0",
    "elasticsearch[async]>=8.19,<9",
    "fastapi>=0.139,<0.140",
    "huggingface-hub>=1.23,<2",
    "langchain-huggingface>=1.2,<2",
    "langchain-openai>=1.3,<1.4",
    "langgraph>=1.2,<1.3",
    "langgraph-checkpoint-redis>=0.5,<0.6",
    "loguru>=0.7.3",
    "mysql-replication>=1.0.12,<2",
    "pydantic>=2.12.5",
    "pyyaml>=6.0.3",
    "qdrant-client[fastembed]>=1.18.0",
    "redis>=5.2.1,<6",
    "sqlalchemy>=2.0.51",
    "sqlglot>=28,<29",
    "uvicorn>=0.51,<0.52",
]

[project.scripts]
data-agent-api = "main:main"
data-agent-cdc = "data_sync.worker:main"

[build-system]
requires = ["setuptools>=80,<81"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = [
    "main",
    "application",
    "settings",
    "app_logging",
    "errors",
    "identifiers",
]

[tool.setuptools.packages.find]
where = ["src"]
include = [
    "answer_readiness",
    "answer_readiness.*",
    "chat",
    "chat.*",
    "conversation",
    "conversation.*",
    "data_sync",
    "data_sync.*",
    "ddl_metadata",
    "ddl_metadata.*",
    "infrastructure",
    "infrastructure.*",
    "memory",
    "memory.*",
    "models",
    "models.*",
    "persistence",
    "persistence.*",
]
namespaces = false

[dependency-groups]
dev = [
    "pyright>=1.1.405,<2",
    "pytest>=9.0.2,<10",
    "pytest-asyncio>=1.3.0,<2",
    "ruff>=0.14.10,<0.15",
]

[tool.ruff]
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "D"]
ignore = ["D400", "D401", "D415"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: requires one or more local infrastructure services",
    "tei: requires the optional local Text Embeddings Inference service",
]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "basic"

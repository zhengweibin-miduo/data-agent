<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">数据与状态职责</title><desc id="desc">Redis 承担任务控制面和 LangGraph 检查点，MySQL 的 meta 与 data_agent 数据库在同一事务中保存快照和规范长期记忆。</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 0 6 9 3z" fill="#315b73"/></marker><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#17324d}.t{font-size:26px;font-weight:700}.n{font-size:19px;font-weight:700}.s{font-size:14px;fill:#587083}.c{fill:#e7f2ff;stroke:#2f6f9f;stroke-width:2}.r{fill:#fff4e8;stroke:#c97d2b;stroke-width:2}.m{fill:#eaf8f4;stroke:#2d8872;stroke-width:2}.box{fill:#fff;stroke:#8da8b7;stroke-width:1.7}.l{fill:none;stroke:#315b73;stroke-width:2.3;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="690" rx="24" fill="#f6f9fc"/><text x="55" y="58" class="t">As-Is · 数据、控制状态与恢复状态</text>
  <rect x="440" y="90" width="320" height="76" rx="16" class="c"/><text x="600" y="122" text-anchor="middle" class="n">API / Worker / LangGraph</text><text x="600" y="148" text-anchor="middle" class="s">用例协调与工作流执行</text>
  <rect x="70" y="230" width="450" height="360" rx="22" class="r"/><text x="100" y="270" class="n">Redis 8.8 · 异步控制面</text>
  <rect x="100" y="305" width="390" height="58" rx="12" class="box"/><text x="120" y="339" class="s">任务 Hash：输入、公开投影、修订、问题与期限</text>
  <rect x="100" y="383" width="390" height="58" rx="12" class="box"/><text x="120" y="417" class="s">来源租约：同一逻辑来源互斥与续期</text>
  <rect x="100" y="461" width="390" height="58" rx="12" class="box"/><text x="120" y="495" class="s">dispatch / waiting / cleanup 有序集合</text>
  <rect x="100" y="539" width="390" height="34" rx="10" class="box"/><text x="120" y="562" class="s">LangGraph checkpoint 与 pending writes</text>
  <rect x="680" y="230" width="450" height="360" rx="22" class="m"/><text x="710" y="270" class="n">MySQL 8.4 · 持久事实</text>
  <rect x="710" y="305" width="390" height="120" rx="14" class="box"/><text x="735" y="340" class="n">meta 数据库</text><text x="735" y="370" class="s">table_info · column_info</text><text x="735" y="396" class="s">metric_info · column_metric</text>
  <rect x="710" y="455" width="390" height="120" rx="14" class="box"/><text x="735" y="490" class="n">data_agent 数据库</text><text x="735" y="520" class="s">agent_memory · event · link · outbox</text><text x="735" y="546" class="s">权威事实、历史与派生索引期望</text>
  <path d="M520 128H300V230" class="l"/><path d="M680 128H900V230" class="l"/><text x="304" y="112" class="s">状态、调度、恢复</text><text x="835" y="112" class="s">已验证快照与记忆</text>
  <text x="600" y="410" text-anchor="middle" class="s">职责隔离</text>
  <text x="600" y="645" text-anchor="middle" class="s">同一 SQLAlchemy engine 与 Session 跨两个 MySQL 数据库原子提交；Redis 与 MySQL 不互相替代。</text>
</svg>

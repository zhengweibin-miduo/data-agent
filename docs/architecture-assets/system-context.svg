<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
<title id="title">Data Agent 当前系统上下文</title><desc id="desc">本机用户通过 API 使用 DDL 工作流和类型化权威记忆能力；Redis 承载控制面，MySQL 保存权威事实，Elasticsearch、Qdrant 与 TEI 提供派生混合检索。</desc>
<defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#f4f8ff"/><stop offset="1" stop-color="#eefaf8"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 0 6 9 3z" fill="#315b73"/></marker><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#17324d}.t{font-size:26px;font-weight:700}.n{font-size:19px;font-weight:700}.s{font-size:13px;fill:#526c7c}.e{font-size:13px;fill:#315b73}.p{fill:#e8f3ff;stroke:#2f6f9f;stroke-width:2}.d{fill:#e9f8f3;stroke:#2d8872;stroke-width:2}.x{fill:#fff4e8;stroke:#c97d2b;stroke-width:2}.z{fill:url(#bg);stroke:#b8ced9;stroke-width:2;stroke-dasharray:8 7}.l{fill:none;stroke:#315b73;stroke-width:2.2;marker-end:url(#a)}.b{fill:none;stroke:#315b73;stroke-width:2.2}</style></defs>
<rect width="1200" height="780" rx="24" fill="url(#bg)"/><text x="50" y="55" class="t">As-Is · 系统上下文</text>
<rect x="250" y="90" width="900" height="610" rx="25" class="z"/><text x="278" y="125" class="s">Data Agent 当前系统边界</text>

<rect x="45" y="180" width="180" height="82" rx="16" fill="#fff" stroke="#88a7b8" stroke-width="2"/><text x="135" y="214" text-anchor="middle" class="n">本机用户 / 浏览器</text><text x="135" y="239" text-anchor="middle" class="s">提交、查询、回答、管理记忆</text>
<rect x="290" y="170" width="230" height="102" rx="17" class="p"/><text x="405" y="207" text-anchor="middle" class="n">DDL 元数据 API</text><text x="405" y="232" text-anchor="middle" class="s">任务边界 · 记忆管理</text><text x="405" y="254" text-anchor="middle" class="s">混合搜索</text>
<rect x="570" y="170" width="220" height="102" rx="17" class="d"/><text x="680" y="207" text-anchor="middle" class="n">Redis 控制面</text><text x="680" y="232" text-anchor="middle" class="s">任务 · 租约 · arq</text><text x="680" y="254" text-anchor="middle" class="s">LangGraph checkpoint</text>
<rect x="840" y="170" width="250" height="102" rx="17" class="p"/><text x="965" y="207" text-anchor="middle" class="n">DDL 元数据 Worker</text><text x="965" y="232" text-anchor="middle" class="s">图执行 · 恢复</text><text x="965" y="254" text-anchor="middle" class="s">索引同步</text>

<path d="M225 221H290M520 221H570M790 221H840" class="l"/>
<text x="245" y="205" class="e">HTTP / JSON</text><text x="535" y="205" class="e">任务 / 状态</text><text x="803" y="205" class="e">arq 激活</text>

<text x="278" y="344" class="s">权威事实与派生检索 · API 查询/管理，Worker 回查/同步</text>
<path d="M405 272V390M965 272V390M405 390H965" class="b"/>
<circle cx="405" cy="390" r="4" fill="#315b73"/><circle cx="965" cy="390" r="4" fill="#315b73"/>

<rect x="330" y="465" width="285" height="100" rx="17" class="d"/><text x="473" y="501" text-anchor="middle" class="n">MySQL</text><text x="473" y="527" text-anchor="middle" class="s">Meta + 权威记忆</text><text x="473" y="549" text-anchor="middle" class="s">索引 outbox</text>
<rect x="690" y="455" width="310" height="120" rx="17" class="x"/><text x="845" y="491" text-anchor="middle" class="n">派生混合检索</text><text x="845" y="518" text-anchor="middle" class="s">Elasticsearch BM25 · Qdrant 向量</text><text x="845" y="542" text-anchor="middle" class="s">TEI 查询/文档嵌入</text>
<path d="M473 390V465M845 390V455" class="l"/>
<text x="490" y="430" class="e">权威事实</text><text x="862" y="430" class="e">可重建投影</text>

<rect x="840" y="610" width="250" height="72" rx="17" class="x"/><text x="965" y="640" text-anchor="middle" class="n">OpenAI 兼容模型</text><text x="965" y="664" text-anchor="middle" class="s">结构化语义与指标生成</text>
<path d="M1090 221H1120V646H1090" class="l"/><text x="1110" y="430" text-anchor="end" class="e">结构化调用</text>

<text x="50" y="742" class="s">一致性边界：MySQL 是事实源；ES/Qdrant 是可重建投影，任一目标故障时检索按信号独立降级。</text>
</svg>

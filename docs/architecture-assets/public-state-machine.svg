<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
  <title id="title">公开任务状态转换</title><desc id="desc">任务从 pending 激活为 running，可在 waiting_input 与 pending 间恢复，最终进入 succeeded、rejected 或 failed。</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 0 6 9 3z" fill="#315b73"/></marker><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#17324d}.t{font-size:26px;font-weight:700}.n{font-size:18px;font-weight:700}.s{font-size:13px;fill:#587083}.c{fill:#e7f2ff;stroke:#2f6f9f;stroke-width:2}.w{fill:#fff4e8;stroke:#c97d2b;stroke-width:2}.ok{fill:#eaf8f4;stroke:#2d8872;stroke-width:2}.b{fill:#fff0ef;stroke:#b34e4e;stroke-width:2}.l{fill:none;stroke:#315b73;stroke-width:2.3;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="610" rx="24" fill="#f6f9fc"/><text x="55" y="58" class="t">As-Is · 公开任务状态机</text>
  <g text-anchor="middle"><rect x="100" y="180" width="190" height="74" rx="37" class="c"/><text x="195" y="225" class="n">pending</text><rect x="505" y="180" width="190" height="74" rx="37" class="c"/><text x="600" y="225" class="n">running</text><rect x="910" y="180" width="220" height="74" rx="37" class="w"/><text x="1020" y="225" class="n">waiting_input</text><rect x="210" y="430" width="210" height="74" rx="37" class="ok"/><text x="315" y="475" class="n">succeeded</text><rect x="495" y="430" width="210" height="74" rx="37" class="b"/><text x="600" y="475" class="n">rejected</text><rect x="780" y="430" width="210" height="74" rx="37" class="b"/><text x="885" y="475" class="n">failed</text></g>
  <path d="M290 217H505" class="l"/><text x="398" y="201" text-anchor="middle" class="s">激活</text>
  <path d="M600 180V125H195V180" class="l"/><text x="398" y="113" text-anchor="middle" class="s">瞬态异常：退回 pending 后有界重试</text>
  <path d="M695 217H910" class="l"/><text x="803" y="201" text-anchor="middle" class="s">interrupt</text>
  <path d="M1020 180V90H195V180" class="l"/><text x="760" y="78" text-anchor="middle" class="s">有效回答：revision + 1</text>
  <path d="M600 254V355M315 355H885" fill="none" stroke="#315b73" stroke-width="2.3"/>
  <circle cx="600" cy="355" r="4" fill="#315b73"/>
  <text x="600" y="335" text-anchor="middle" class="s">终态分支总线</text>
  <path d="M315 355V430M600 355V430M885 355V430" class="l"/>
  <text x="315" y="390" text-anchor="middle" class="s">快照成功</text><text x="600" y="390" text-anchor="middle" class="s">业务拒绝</text><text x="885" y="390" text-anchor="middle" class="s">重试耗尽 / 非重试错误</text>
  <path d="M1020 254V530H600V504" class="l"/><text x="760" y="524" text-anchor="middle" class="s">回答超时</text>
  <text x="600" y="560" text-anchor="middle" class="s">succeeded、rejected、failed 为终态：释放来源租约，清除敏感字段，设置保留 TTL，并写入 checkpoint cleanup outbox。</text>
</svg>

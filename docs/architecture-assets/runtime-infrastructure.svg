<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">当前进程与基础设施架构</title><desc id="desc">FastAPI 与 arq Worker 都初始化 Redis、MySQL、Elasticsearch、Qdrant 和 TEI；Worker 还使用检查点和模型服务并同步记忆索引 outbox。</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 0 6 9 3z" fill="#315b73"/></marker><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#17324d}.t{font-size:26px;font-weight:700}.n{font-size:18px;font-weight:700}.s{font-size:13px;fill:#536b7b}.e{font-size:12px;fill:#315b73}.p{fill:#e8f3ff;stroke:#2f6f9f;stroke-width:2}.d{fill:#eaf8f4;stroke:#2d8872;stroke-width:2}.x{fill:#fff4e8;stroke:#c97d2b;stroke-width:2}.z{fill:#fff;stroke:#c2d3dd;stroke-width:2}.l{fill:none;stroke:#315b73;stroke-width:2.2;marker-end:url(#a)}.b{fill:none;stroke:#315b73;stroke-width:2.2}.g{fill:#fffaf4;stroke:#e5bd8d;stroke-width:1.5;stroke-dasharray:6 5}.w{fill:#fff;stroke:#8fb7aa;stroke-width:1.3}</style></defs>
<rect width="1200" height="800" rx="24" fill="#f6f9fc"/><text x="50" y="55" class="t">As-Is · 进程与基础设施</text>
<rect x="50" y="85" width="1100" height="630" rx="22" class="z"/><text x="78" y="120" class="s">上层：进程主链路</text>

<rect x="75" y="165" width="170" height="78" rx="15" class="p"/><text x="160" y="198" text-anchor="middle" class="n">浏览器 / API</text><text x="160" y="222" text-anchor="middle" class="s">本机调用方</text>
<rect x="305" y="155" width="220" height="98" rx="16" class="p"/><text x="415" y="192" text-anchor="middle" class="n">FastAPI :8000</text><text x="415" y="217" text-anchor="middle" class="s">任务 API · 记忆 API</text><text x="415" y="238" text-anchor="middle" class="s">结构化生命周期日志</text>
<rect x="585" y="145" width="250" height="118" rx="16" class="d"/><text x="710" y="176" text-anchor="middle" class="n">Redis :6379</text><text x="710" y="198" text-anchor="middle" class="s">同一服务：任务 · arq · checkpoint</text>
<rect x="603" y="211" width="102" height="34" rx="9" class="w"/><text x="654" y="233" text-anchor="middle" class="e">应用客户端</text>
<rect x="715" y="211" width="102" height="34" rx="9" class="w"/><text x="766" y="233" text-anchor="middle" class="e">Checkpoint Saver</text>
<rect x="895" y="155" width="230" height="98" rx="16" class="p"/><text x="1010" y="192" text-anchor="middle" class="n">arq Worker</text><text x="1010" y="217" text-anchor="middle" class="s">工作流 · 恢复 · 重试</text><text x="1010" y="238" text-anchor="middle" class="s">索引 outbox dispatcher</text>

<path d="M245 204H305M525 204H585M835 204H895" class="l"/>
<text x="268" y="190" class="e">HTTP</text><text x="548" y="190" class="e">任务 / 状态</text><text x="854" y="190" class="e">arq</text>

<rect x="885" y="292" width="250" height="72" rx="16" class="x"/><text x="1010" y="322" text-anchor="middle" class="n">OpenAI 兼容接口</text><text x="1010" y="346" text-anchor="middle" class="s">Worker 结构化模型调用</text>
<path d="M1010 253V292" class="l"/><text x="1022" y="277" class="e">模型调用</text>

<text x="78" y="326" class="s">下层：API 与 Worker 共享基础设施</text>
<path d="M415 253V400M945 253H860V400M165 400H1045" class="b"/>
<circle cx="415" cy="400" r="4" fill="#315b73"/><circle cx="860" cy="400" r="4" fill="#315b73"/>
<text x="530" y="390" class="e">API 与 Worker 共享基础设施访问总线</text>

<rect x="80" y="470" width="245" height="96" rx="16" class="d"/><text x="203" y="502" text-anchor="middle" class="n">MySQL :3306</text><text x="203" y="527" text-anchor="middle" class="s">Meta · 权威记忆</text><text x="203" y="548" text-anchor="middle" class="s">索引 outbox</text>
<path d="M203 400V470" class="l"/>

<rect x="350" y="445" width="760" height="145" rx="18" class="g"/><text x="375" y="472" class="s">当前派生混合检索链路 · TEI 嵌入 + ES BM25 + Qdrant 向量检索</text>
<rect x="375" y="490" width="215" height="76" rx="15" class="x"/><text x="483" y="521" text-anchor="middle" class="n">Elasticsearch :9200</text><text x="483" y="546" text-anchor="middle" class="s">BM25 派生投影</text>
<rect x="620" y="490" width="215" height="76" rx="15" class="x"/><text x="728" y="521" text-anchor="middle" class="n">Qdrant :6333</text><text x="728" y="546" text-anchor="middle" class="s">向量派生投影</text>
<rect x="865" y="490" width="215" height="76" rx="15" class="x"/><text x="973" y="521" text-anchor="middle" class="n">TEI :8080</text><text x="973" y="546" text-anchor="middle" class="s">1024 维嵌入</text>
<path d="M483 400V490M728 400V490M973 400V490" class="l"/>

<text x="600" y="638" text-anchor="middle" class="s">API 负责混合搜索与记忆管理；Worker 负责工作流上下文、双目标索引同步和失败退避。</text>
<text x="600" y="674" text-anchor="middle" class="s">Redis 是一个服务；应用客户端与 LangGraph Checkpoint Saver 使用不同序列化和生命周期包装器。</text>
<text x="600" y="756" text-anchor="middle" class="s">ES/Qdrant/TEI 已进入当前业务生命周期，不再是仅预置服务。</text>
</svg>

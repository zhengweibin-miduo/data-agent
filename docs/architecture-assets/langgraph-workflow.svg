<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1120" role="img" aria-labelledby="title desc">
  <title id="title">LangGraph DDL 元数据工作流</title><desc id="desc">从 DDL 解析、记忆加载、语义生成和校验，到指标问题、人工回答、指标生成、候选记忆和快照持久化的当前工作流。</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 0 6 9 3z" fill="#315b73"/></marker><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#17324d}.t{font-size:26px;font-weight:700}.n{font-size:17px;font-weight:700}.s{font-size:13px;fill:#587083}.c{fill:#fff;stroke:#7f9eaf;stroke-width:2}.m{fill:#e7f2ff;stroke:#2f6f9f}.d{fill:#eaf8f4;stroke:#2d8872}.w{fill:#fff4e8;stroke:#c97d2b}.b{fill:#fff0ef;stroke:#b34e4e}.l{fill:none;stroke:#315b73;stroke-width:2.2;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="1120" rx="24" fill="#f6f9fc"/><text x="55" y="58" class="t">As-Is · LangGraph DDL 元数据工作流</text>
  <g text-anchor="middle">
    <rect x="500" y="82" width="200" height="54" rx="27" class="d"/><text x="600" y="116" class="n">START</text>
    <rect x="430" y="170" width="340" height="64" rx="14" class="c"/><text x="600" y="209" class="n">parse_ddl</text>
    <rect x="430" y="270" width="340" height="64" rx="14" class="c"/><text x="600" y="309" class="n">load_and_validate_memory</text>
    <rect x="250" y="380" width="300" height="70" rx="14" class="m"/><text x="400" y="411" class="n">classify_metadata</text><text x="400" y="435" class="s">结构化语义生成</text>
    <rect x="650" y="380" width="300" height="70" rx="14" class="c"/><text x="800" y="411" class="n">validate_metadata</text><text x="800" y="435" class="s">角色、引用与置信度</text>
    <rect x="430" y="510" width="340" height="70" rx="14" class="c"/><text x="600" y="541" class="n">plan_metric_questions</text><text x="600" y="565" class="s">缺少业务含义时生成问题</text>
    <rect x="430" y="620" width="340" height="70" rx="14" class="w"/><text x="600" y="651" class="n">await_metric_answers</text><text x="600" y="675" class="s">interrupt / resume，最多两轮</text>
    <rect x="250" y="750" width="300" height="70" rx="14" class="m"/><text x="400" y="781" class="n">generate_metrics</text><text x="400" y="805" class="s">结构化指标生成</text>
    <rect x="650" y="750" width="300" height="70" rx="14" class="c"/><text x="800" y="781" class="n">validate_metrics</text><text x="800" y="805" class="s">AST、引用与角色校验</text>
    <rect x="430" y="870" width="340" height="64" rx="14" class="c"/><text x="600" y="909" class="n">build_memory_candidates</text>
    <rect x="430" y="970" width="340" height="64" rx="14" class="d"/><text x="600" y="1009" class="n">persist_snapshot</text>
    <rect x="500" y="1060" width="200" height="46" rx="23" class="d"/><text x="600" y="1090" class="n">SUCCEEDED</text>
    <rect x="990" y="510" width="160" height="70" rx="14" class="b"/><text x="1070" y="552" class="n">REJECTED</text>
  </g>
  <path d="M600 136V170M600 234V270M600 334V360H400V380M550 415H650M800 450V475H600V510M600 580V620M600 690V720H400V750M550 785H650M800 820V845H600V870M600 934V970M600 1034V1060" class="l"/>
  <path d="M800 380V350H400V380" class="l"/><text x="600" y="342" text-anchor="middle" class="s">结构失败：最多修复一次</text>
  <path d="M800 750V715H400V750" class="l"/><text x="600" y="707" text-anchor="middle" class="s">可修复：最多再生成一次</text>
  <path d="M770 545H990" class="l"/><path d="M950 785H1070V580" class="l"/><text x="905" y="536" class="s">不可修复</text>
</svg>

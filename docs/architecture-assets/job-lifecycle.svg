<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
  <title id="title">DDL 元数据任务主流程</title>
  <desc id="desc">任务从提交、Redis 原子受理、arq 调度、Worker 执行到等待输入、成功、业务拒绝或失败的完整流程。</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 0 6 9 3z" fill="#315b73"/></marker><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#17324d}.t{font-size:26px;font-weight:700}.n{font-size:18px;font-weight:700}.s{font-size:14px;fill:#536b7b}.c{fill:#fff;stroke:#7f9eaf;stroke-width:2}.active{fill:#e7f2ff;stroke:#2f6f9f}.ok{fill:#e9f8f3;stroke:#2d8872}.warn{fill:#fff4e8;stroke:#c97d2b}.bad{fill:#fff0ef;stroke:#b34e4e}.l{fill:none;stroke:#315b73;stroke-width:2.3;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="850" rx="24" fill="#f6f9fc"/><text x="55" y="58" class="t">As-Is · DDL 任务从受理到终态</text>
  <g text-anchor="middle">
    <rect x="430" y="90" width="340" height="64" rx="15" class="active"/><text x="600" y="129" class="n">用户提交 DDL 任务</text>
    <rect x="430" y="190" width="340" height="74" rx="15" class="c"/><text x="600" y="221" class="n">FastAPI → DDLJobStore</text><text x="600" y="246" class="s">协议映射，不直接改 Redis 字段</text>
    <rect x="380" y="300" width="440" height="82" rx="15" class="ok"/><text x="600" y="334" class="n">Redis Lua 原子受理</text><text x="600" y="360" class="s">job + source lease + dispatch outbox → HTTP 202</text>
    <rect x="430" y="420" width="340" height="70" rx="15" class="c"/><text x="600" y="450" class="n">周期调度进入 arq</text><text x="600" y="474" class="s">队列 ID 含 job_id 与 revision</text>
    <rect x="390" y="530" width="420" height="78" rx="15" class="active"/><text x="600" y="562" class="n">Worker 校验修订与状态</text><text x="600" y="588" class="s">续租，转换 running，执行或恢复 LangGraph</text>
  </g>
  <path d="M600 154 V190" class="l"/><path d="M600 264 V300" class="l"/><path d="M600 382 V420" class="l"/><path d="M600 490 V530" class="l"/>
  <path d="M600 608 V650 H160 V680" class="l"/><path d="M600 608 V680" class="l"/><path d="M600 608 V650 H880 V680" class="l"/><path d="M600 608 V635 H1070 V680" class="l"/>
  <g text-anchor="middle">
    <rect x="45" y="680" width="230" height="88" rx="15" class="warn"/><text x="160" y="715" class="n">waiting_input</text><text x="160" y="742" class="s">回答后 rev+1 再调度</text>
    <rect x="480" y="680" width="240" height="88" rx="15" class="ok"/><text x="600" y="715" class="n">MySQL 原子提交</text><text x="600" y="742" class="s">→ succeeded</text>
    <rect x="765" y="680" width="230" height="88" rx="15" class="bad"/><text x="880" y="715" class="n">rejected</text><text x="880" y="742" class="s">确定性业务拒绝</text>
    <rect x="1020" y="680" width="140" height="88" rx="15" class="bad"/><text x="1090" y="715" class="n">failed</text><text x="1090" y="742" class="s">非重试 / 耗尽</text>
  </g>
  <path d="M160 768 V810 H600" class="l"/><path d="M600 768 V810" class="l"/><path d="M880 768 V810 H600" class="l"/><path d="M1090 768 V810 H600" class="l"/>
  <text x="600" y="836" text-anchor="middle" class="s">终态：安全 Redis 投影；checkpoint 删除失败时由 cleanup outbox 重试</text>
</svg>

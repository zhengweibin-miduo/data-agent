<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 760" role="img" aria-labelledby="title desc">
  <title id="title">Accepted Snapshot 后的异步收敛</title><desc id="desc">Accepted Snapshot 在 generation locks 下用一个 MySQL 事务写入 Meta、Memory、Data Sync desired state 和两个 projection outbox。事务成功后 CDC、Meta Projection 与 Memory Projection 三条链路独立重试和收敛，不反转 DDL Job 成功。</desc>
  <defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width=".5"/></pattern><marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748b"/></marker><marker id="orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#fb923c"/></marker><style>text{font-family:"Cascadia Code","Noto Sans SC","PingFang SC",sans-serif}.title{font-size:20px;font-weight:700;fill:#f8fafc}.sub{font-size:10px;fill:#94a3b8}.head{font-size:11px;font-weight:700;fill:#f8fafc}.body{font-size:9px;fill:#cbd5e1}.tiny{font-size:8px;fill:#94a3b8}.arrow{fill:none;stroke:#64748b;stroke-width:1.5;marker-end:url(#arrow)}.async{fill:none;stroke:#fb923c;stroke-width:1.5;stroke-dasharray:6 4;marker-end:url(#orange)}</style></defs>
  <rect width="1160" height="760" fill="#0f172a"/><rect width="1160" height="760" fill="url(#grid)"/><text x="30" y="38" class="title">Accepted Snapshot：权威事务先落地，派生链路后收敛</text><text x="30" y="58" class="sub">generation = 同一张源表 schema 版本；lock 防止旧 generation 晚到并覆盖新状态</text>
  <!-- connectors -->
  <path d="M210 180H390" class="arrow"/><path d="M590 300v55" class="arrow"/><path d="M590 465v55" class="async"/>
  <path d="M470 425C330 470 210 500 210 555" class="async"/><path d="M590 465v90" class="async"/><path d="M710 425c140 45 240 75 240 130" class="async"/>
  <!-- top -->
  <g text-anchor="middle"><rect x="50" y="130" width="160" height="100" rx="8" fill="#0f172a"/><rect x="50" y="130" width="160" height="100" rx="8" fill="rgba(6,78,59,.48)" stroke="#34d399" stroke-width="1.5"/><text x="130" y="157" class="head">persist_snapshot</text><text x="130" y="176" class="body">DDL graph 成功出口</text><text x="130" y="194" class="body">目标表集合 + generation</text><text x="130" y="212" class="tiny">先取全部 generation locks</text>
  <rect x="390" y="105" width="400" height="195" rx="10" fill="#0f172a"/><rect x="390" y="105" width="400" height="195" rx="10" fill="rgba(76,29,149,.43)" stroke="#a78bfa" stroke-width="1.5"/><text x="590" y="132" class="head">一个 MySQL managed transaction</text><text x="590" y="151" class="tiny">任一写入失败则整体回滚</text></g>
  <g class="body"><circle cx="425" cy="180" r="4" fill="#a78bfa"/><text x="438" y="184">Meta Snapshot：schema / semantics / metrics</text><circle cx="425" cy="207" r="4" fill="#a78bfa"/><text x="438" y="211">Long-term Memory：accepted candidates + audit</text><circle cx="425" cy="234" r="4" fill="#a78bfa"/><text x="438" y="238">Data Sync desired state + generation handoff</text><circle cx="425" cy="261" r="4" fill="#fb923c"/><text x="438" y="265">Meta / Memory projection outbox + desired state</text></g>
  <g text-anchor="middle"><polygon points="590,355 710,410 590,465 470,410" fill="#0f172a"/><polygon points="590,355 710,410 590,465 470,410" fill="rgba(120,53,15,.35)" stroke="#fbbf24" stroke-width="1.5"/><text x="590" y="404" class="head">事务提交成功？</text><text x="590" y="423" class="tiny">成功后 DDL Job = succeeded</text></g>
  <path d="M470 410H280" fill="none" stroke="#fb7185" stroke-width="1.5" marker-end="url(#arrow)"/><text x="370" y="400" class="tiny" fill="#fb7185" text-anchor="middle">否：整体回滚 / Job failed</text><text x="608" y="493" class="tiny" fill="#34d399">是：异步扇出</text>
  <!-- lanes -->
  <g text-anchor="middle"><rect x="45" y="555" width="330" height="150" rx="10" fill="#0f172a"/><rect x="45" y="555" width="330" height="150" rx="10" fill="rgba(251,146,60,.22)" stroke="#fb923c"/><text x="210" y="583" class="head">Data Sync / data-agent-cdc</text><text x="210" y="606" class="body">PENDING_SCHEMA → BUFFERING → BACKFILLING</text><text x="210" y="626" class="body">→ REPLAYING → STREAMING</text><text x="210" y="650" class="tiny">Binlog 位点、回填与缓冲事件按 generation 协调</text><text x="210" y="675" class="tiny" fill="#fb7185">paused / conflict / dead：独立处理与重试</text>
  <rect x="415" y="555" width="350" height="150" rx="10" fill="#0f172a"/><rect x="415" y="555" width="350" height="150" rx="10" fill="rgba(251,146,60,.22)" stroke="#fb923c"/><text x="590" y="583" class="head">Meta Projection dispatcher</text><text x="590" y="607" class="body">semantic / values desired state</text><text x="590" y="631" class="body">→ Elasticsearch / Qdrant</text><text x="590" y="655" class="tiny">索引失败只延迟检索视图；MySQL 事实不变</text><text x="590" y="679" class="tiny">可按权威状态重建</text>
  <rect x="805" y="555" width="310" height="150" rx="10" fill="#0f172a"/><rect x="805" y="555" width="310" height="150" rx="10" fill="rgba(251,146,60,.22)" stroke="#fb923c"/><text x="960" y="583" class="head">Memory Projection dispatcher</text><text x="960" y="607" class="body">memory desired state</text><text x="960" y="631" class="body">→ ES lexical / Qdrant vector</text><text x="960" y="655" class="tiny">索引只返回候选 ID；最终回查 MySQL</text><text x="960" y="679" class="tiny">可降级、可重建</text></g>
  <rect x="285" y="720" width="590" height="26" rx="6" fill="rgba(136,19,55,.32)" stroke="#fb7185"/><text x="580" y="738" class="body" text-anchor="middle">CDC 或投影失败不会回滚已接受的 Snapshot，也不会把 succeeded 的 DDL Job 改回失败。</text>
</svg>

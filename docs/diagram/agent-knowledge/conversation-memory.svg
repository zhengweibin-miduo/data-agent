<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 760" role="img" aria-labelledby="title desc">
  <title id="title">Conversation 与长期记忆协作</title><desc id="desc">事务一提交用户消息并占用 turn lease；事务二提交助手消息与 extraction outbox 并释放 lease。两段之间失败时会保留用户消息和活动 lease。Worker 只从用户证据抽取候选，经验证后写入 MySQL 权威记忆。</desc>
  <defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width=".5"/></pattern><marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748b"/></marker><marker id="orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polyline points="0 0,10 3.5,0 7" fill="none" stroke="#fb923c" stroke-width="1.5"/></marker><style>text{font-family:"Cascadia Code","Noto Sans SC","PingFang SC",sans-serif}.title{font-size:20px;font-weight:700;fill:#f8fafc}.sub{font-size:10px;fill:#94a3b8}.head{font-size:11px;font-weight:700;fill:#f8fafc}.body{font-size:9px;fill:#cbd5e1}.tiny{font-size:8px;fill:#94a3b8}.arrow{fill:none;stroke:#64748b;stroke-width:1.5;marker-end:url(#arrow)}.async{fill:none;stroke:#fb923c;stroke-width:1.5;stroke-dasharray:6 4;marker-end:url(#orange)}</style></defs>
  <rect width="1160" height="760" fill="#0f172a"/><rect width="1160" height="760" fill="url(#grid)"/><text x="30" y="38" class="title">Conversation 保存“说过什么”，Memory 保存“可复用事实”</text><text x="30" y="58" class="sub">candidate 必须引用用户原话与 message UID；助手生成文本不能单独升级为长期事实</text>
  <!-- arrows -->
  <path d="M225 170h95" class="arrow"/><path d="M520 170h85" class="arrow"/><path d="M810 170h80" class="async"/><path d="M995 220v90" class="async"/><path d="M890 360H700" class="arrow"/><path d="M600 410v85" class="arrow"/><path d="M500 550H330" class="arrow"/><path d="M700 550h135" class="async"/><path d="M835 610H700" class="arrow"/><path d="M500 610H330" class="arrow"/>
  <!-- capture -->
  <g text-anchor="middle"><rect x="45" y="120" width="180" height="100" rx="8" fill="#0f172a"/><rect x="45" y="120" width="180" height="100" rx="8" fill="rgba(8,51,68,.5)" stroke="#22d3ee"/><text x="135" y="147" class="head">用户原话</text><text x="135" y="170" class="body">“净销售额要扣除退款”</text><text x="135" y="192" class="tiny">tenant + conversation + message UID</text>
  <rect x="320" y="120" width="200" height="100" rx="8" fill="#0f172a"/><rect x="320" y="120" width="200" height="100" rx="8" fill="rgba(6,78,59,.48)" stroke="#34d399"/><text x="420" y="147" class="head">事务一 · start_turn</text><text x="420" y="170" class="body">提交用户消息 + turn lease</text><text x="420" y="191" class="tiny">中间失败：两者保留，尚无助手消息</text>
  <rect x="605" y="120" width="205" height="100" rx="8" fill="#0f172a"/><rect x="605" y="120" width="205" height="100" rx="8" fill="rgba(76,29,149,.48)" stroke="#a78bfa"/><text x="707" y="147" class="head">事务二 · complete_turn</text><text x="707" y="170" class="body">助手消息 + extraction outbox</text><text x="707" y="191" class="tiny">同事务提交并释放 turn lease</text>
  <rect x="890" y="120" width="220" height="100" rx="8" fill="#0f172a"/><rect x="890" y="120" width="220" height="100" rx="8" fill="rgba(251,146,60,.22)" stroke="#fb923c"/><text x="1000" y="147" class="head">Extraction worker cron</text><text x="1000" y="170" class="body">claim outbox → 提取 candidate</text><text x="1000" y="191" class="tiny">异步失败不丢 Conversation</text>
  <polygon points="1000,310 1110,360 1000,410 890,360" fill="#0f172a"/><polygon points="1000,310 1110,360 1000,410 890,360" fill="rgba(120,53,15,.35)" stroke="#fbbf24" stroke-width="1.5"/><text x="1000" y="355" class="head">证据有效？</text><text x="1000" y="375" class="tiny">用户原话 + scope + hash</text>
  <rect x="500" y="310" width="200" height="100" rx="8" fill="#0f172a"/><rect x="500" y="310" width="200" height="100" rx="8" fill="rgba(76,29,149,.48)" stroke="#a78bfa"/><text x="600" y="337" class="head">MySQL Memory authority</text><text x="600" y="360" class="body">candidate / version / audit</text><text x="600" y="381" class="tiny">update 新版本；delete 软删除</text></g>
  <text x="785" y="349" class="tiny" fill="#34d399">是：controlled creation</text><text x="1015" y="438" class="tiny" fill="#fb7185">否：丢弃或记录失败</text>
  <!-- search -->
  <rect x="35" y="480" width="1090" height="220" rx="12" fill="none" stroke="#64748b" stroke-dasharray="8 4"/><text x="50" y="501" class="body">下一次 Chat 的检索路径</text>
  <g text-anchor="middle"><rect x="90" y="520" width="240" height="130" rx="8" fill="#0f172a"/><rect x="90" y="520" width="240" height="130" rx="8" fill="rgba(6,78,59,.48)" stroke="#34d399"/><text x="210" y="548" class="head">MemoryService.search</text><text x="210" y="573" class="body">exact + ES lexical + Qdrant vector</text><text x="210" y="594" class="body">并发召回，exact-priority RRF 融合</text><text x="210" y="620" class="tiny">公共服务另有 get/history/update/delete</text>
  <rect x="500" y="500" width="200" height="170" rx="8" fill="#0f172a"/><rect x="500" y="500" width="200" height="170" rx="8" fill="rgba(76,29,149,.48)" stroke="#a78bfa"/><text x="600" y="528" class="head">MySQL 最终回查</text><text x="600" y="553" class="body">tenant / source / category</text><text x="600" y="574" class="body">status / version / hash</text><text x="600" y="595" class="body">validity / object scope</text><text x="600" y="625" class="tiny">索引只提供候选 ID</text><text x="600" y="647" class="tiny">权威过滤后才可进入模型上下文</text>
  <rect x="835" y="520" width="245" height="130" rx="8" fill="#0f172a"/><rect x="835" y="520" width="245" height="130" rx="8" fill="rgba(251,146,60,.22)" stroke="#fb923c"/><text x="957" y="548" class="head">Memory Projection</text><text x="957" y="573" class="body">ES lexical + Qdrant vector</text><text x="957" y="594" class="body">消费 desired state / outbox</text><text x="957" y="620" class="tiny">可降级、可重建、不可反写 MySQL</text></g>
  <rect x="250" y="715" width="660" height="28" rx="6" fill="rgba(136,19,55,.32)" stroke="#fb7185"/><text x="580" y="734" class="body" text-anchor="middle">边界：Conversation 摘要与近期消息不是长期记忆；检索命中也必须通过 MySQL 权威校验。</text>
</svg>

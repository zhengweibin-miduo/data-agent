<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 900" role="img" aria-labelledby="title desc">
  <title id="title">Data Agent 当前系统架构</title>
  <desc id="desc">从独立前端到 FastAPI、arq Worker、CDC 进程及 MySQL、Redis、Elasticsearch、Qdrant 的左到右架构图。</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="0.6"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#34d399"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#fb923c"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#a78bfa"/>
    </marker>
    <style>
      text { font-family:'SF Mono','Cascadia Code','Noto Sans SC','PingFang SC',sans-serif; }
      .region { fill:none; stroke-width:1.2; stroke-dasharray:8 5; }
      .box { stroke-width:1.5; }
      .name { fill:#f8fafc; font-size:13px; font-weight:700; text-anchor:middle; }
      .sub { fill:#94a3b8; font-size:10px; text-anchor:middle; }
      .region-label { font-size:11px; font-weight:700; letter-spacing:.04em; }
      .edge { fill:none; stroke:#94a3b8; stroke-width:1.6; marker-end:url(#arrow); }
      .edge-cyan { fill:none; stroke:#22d3ee; stroke-width:1.7; marker-end:url(#arrow-cyan); }
      .edge-green { fill:none; stroke:#34d399; stroke-width:1.7; marker-end:url(#arrow-green); }
      .edge-orange { fill:none; stroke:#fb923c; stroke-width:1.7; marker-end:url(#arrow-orange); }
      .edge-purple { fill:none; stroke:#a78bfa; stroke-width:1.6; marker-end:url(#arrow-purple); }
      .async { stroke-dasharray:7 5; }
      .edge-label { fill:#cbd5e1; font-size:9px; text-anchor:middle; paint-order:stroke; stroke:#0f172a; stroke-width:5px; stroke-linejoin:round; }
    </style>
  </defs>

  <rect width="1640" height="900" fill="#0f172a"/>
  <rect width="1640" height="900" fill="url(#grid)"/>

  <text x="40" y="42" fill="#f8fafc" font-size="20" font-weight="700">Data Agent · 当前系统架构</text>
  <text x="40" y="64" fill="#94a3b8" font-size="11">确定性边界约束模型 · MySQL 保存权威事实 · Redis 承载任务协议 · ES / Qdrant 为可重建投影</text>

  <!-- regions -->
  <rect class="region" x="30" y="92" width="245" height="676" rx="14" stroke="#22d3ee"/>
  <text class="region-label" x="46" y="116" fill="#22d3ee">独立前端 · frontend/src</text>
  <rect class="region" x="305" y="92" width="390" height="676" rx="14" stroke="#34d399"/>
  <text class="region-label" x="321" y="116" fill="#34d399">API PROCESS · backend/src/application.py</text>
  <rect class="region" x="725" y="92" width="355" height="676" rx="14" stroke="#fbbf24"/>
  <text class="region-label" x="741" y="116" fill="#fbbf24">ARQ WORKER · 后台编排与投影</text>
  <rect class="region" x="1110" y="92" width="200" height="676" rx="14" stroke="#fb923c"/>
  <text class="region-label" x="1126" y="116" fill="#fb923c">data-agent-cdc</text>
  <rect class="region" x="1340" y="92" width="270" height="676" rx="14" stroke="#a78bfa"/>
  <text class="region-label" x="1356" y="116" fill="#a78bfa">状态与基础设施</text>

  <!-- edges: browser to API -->
  <path class="edge-cyan" d="M245 185H335"/>
  <text class="edge-label" x="290" y="176">Chat HTTP</text>
  <path class="edge-cyan" d="M245 305H290V205H335"/>
  <text class="edge-label" x="286" y="285">preview / submit</text>
  <path class="edge-cyan async" d="M335 200H310V425H245"/>
  <text class="edge-label" x="306" y="405">DDL Job SSE</text>

  <!-- API internal -->
  <path class="edge-green" d="M500 215V245"/>
  <path class="edge-green" d="M500 315V345"/>
  <path class="edge" d="M455 315V330H320V507H335"/>
  <path class="edge" d="M485 507H515"/>
  <path class="edge-purple" d="M665 280H700V610H665"/>
  <text class="edge-label" x="684" y="300">生成</text>
  <path class="edge-purple" d="M500 415V590"/>
  <text class="edge-label" x="521" y="568">分类</text>
  <path class="edge-purple async" d="M755 555H710V650H665"/>
  <text class="edge-label" x="713" y="638">抽取</text>

  <!-- API to Redis / worker -->
  <path class="edge-orange" d="M665 180H1365"/>
  <text class="edge-label" x="850" y="170">Redis 原子受理：job + source lease + dispatch outbox</text>
  <path class="edge-orange async" d="M1365 220H1050V185"/>
  <text class="edge-label" x="1210" y="211">立即入队 / cron 重放</text>
  <path class="edge async" d="M1365 205H700V195H665"/>
  <text class="edge-label" x="1160" y="196">Job events / 权威回读</text>

  <!-- worker flow -->
  <path class="edge-green" d="M900 220V265"/>
  <path class="edge-green" d="M900 345V390"/>
  <path class="edge-orange async" d="M1000 220H1065V555H1050"/>
  <path class="edge-orange async" d="M1015 220H1070V675H1050"/>

  <!-- authority writes / reads -->
  <path class="edge-green" d="M1050 430H1085V505H1320V430H1370"/>
  <text class="edge-label" x="1195" y="496">generation locks + 单一 MySQL 事务</text>
  <path class="edge" d="M665 505H700V740H1320V450H1370"/>
  <text class="edge-label" x="1130" y="731">Conversation / Memory 权威读写</text>
  <path class="edge" d="M665 380H1085V335H1320V410H1370"/>
  <text class="edge-label" x="950" y="326">Data Sync phase + heartbeat</text>

  <!-- projection -->
  <path class="edge-orange async" d="M1050 675H1325V625H1370"/>
  <text class="edge-label" x="1190" y="665">projection outbox</text>

  <!-- CDC -->
  <path class="edge-orange" d="M1210 285V365"/>
  <text class="edge-label" x="1228" y="328">Binlog</text>
  <path class="edge-orange" d="M1210 485V530"/>
  <path class="edge-orange" d="M1280 570H1370V505"/>
  <text class="edge-label" x="1325" y="560">DW apply</text>
  <path class="edge-orange" d="M1370 290H1280V245"/>
  <text class="edge-label" x="1325" y="280">source rows</text>
  <path class="edge" d="M1370 480H1325V425H1280"/>
  <text class="edge-label" x="1325" y="415">desired state</text>

  <!-- masks and browser boxes -->
  <rect x="60" y="145" width="185" height="80" rx="8" fill="#0f172a"/>
  <rect class="box" x="60" y="145" width="185" height="80" rx="8" fill="rgba(8,51,68,.45)" stroke="#22d3ee"/>
  <text class="name" x="152.5" y="177">Chat / Conversation UI</text>
  <text class="sub" x="152.5" y="196">普通长 HTTP · 完整响应</text>
  <text class="sub" x="152.5" y="211">当前 source + DDL context</text>

  <rect x="60" y="265" width="185" height="80" rx="8" fill="#0f172a"/>
  <rect class="box" x="60" y="265" width="185" height="80" rx="8" fill="rgba(8,51,68,.45)" stroke="#22d3ee"/>
  <text class="name" x="152.5" y="297">DDL Workbench</text>
  <text class="sub" x="152.5" y="316">preview · submit · answers</text>
  <text class="sub" x="152.5" y="331">authoritative Job read</text>

  <rect x="60" y="385" width="185" height="80" rx="8" fill="#0f172a"/>
  <rect class="box" x="60" y="385" width="185" height="80" rx="8" fill="rgba(8,51,68,.45)" stroke="#22d3ee"/>
  <text class="name" x="152.5" y="417">EventSource</text>
  <text class="sub" x="152.5" y="436">仅 DDL Job 事件</text>
  <text class="sub" x="152.5" y="451">自动重连 + Last-Event-ID</text>

  <!-- API boxes -->
  <rect x="335" y="145" width="330" height="70" rx="8" fill="#0f172a"/>
  <rect class="box" x="335" y="145" width="330" height="70" rx="8" fill="rgba(6,78,59,.45)" stroke="#34d399"/>
  <text class="name" x="500" y="174">FastAPI adapters</text>
  <text class="sub" x="500" y="193">Chat · Conversation · DDL Metadata · health / OpenAPI</text>

  <rect x="335" y="245" width="330" height="70" rx="8" fill="#0f172a"/>
  <rect class="box" x="335" y="245" width="330" height="70" rx="8" fill="rgba(6,78,59,.45)" stroke="#34d399"/>
  <text class="name" x="500" y="274">ChatService</text>
  <text class="sub" x="500" y="293">parse DDL → start/replay turn → gate → model → complete</text>

  <rect x="335" y="345" width="330" height="70" rx="8" fill="#0f172a"/>
  <rect class="box" x="335" y="345" width="330" height="70" rx="8" fill="rgba(6,78,59,.45)" stroke="#34d399"/>
  <text class="name" x="500" y="374">Answer Readiness</text>
  <text class="sub" x="500" y="393">意图分类 + Data Sync phase / heartbeat 只读门禁</text>

  <rect x="335" y="465" width="150" height="85" rx="8" fill="#0f172a"/>
  <rect class="box" x="335" y="465" width="150" height="85" rx="8" fill="rgba(6,78,59,.45)" stroke="#34d399"/>
  <text class="name" x="410" y="497">Conversation</text>
  <text class="sub" x="410" y="516">turn lease · summary</text>
  <text class="sub" x="410" y="533">messages · extraction outbox</text>

  <rect x="515" y="465" width="150" height="85" rx="8" fill="#0f172a"/>
  <rect class="box" x="515" y="465" width="150" height="85" rx="8" fill="rgba(6,78,59,.45)" stroke="#34d399"/>
  <text class="name" x="590" y="497">Long-term Memory</text>
  <text class="sub" x="590" y="516">search / get / history</text>
  <text class="sub" x="590" y="533">update / delete</text>

  <rect x="335" y="590" width="330" height="85" rx="8" fill="#0f172a"/>
  <rect class="box" x="335" y="590" width="330" height="85" rx="8" fill="rgba(76,29,149,.4)" stroke="#a78bfa"/>
  <text class="name" x="500" y="622">共享文本模型</text>
  <text class="sub" x="500" y="641">DDL Copilot · readiness classifier · extraction</text>
  <text class="sub" x="500" y="658">没有 DW 行查询 / SQL 工具</text>

  <!-- worker boxes -->
  <rect x="755" y="145" width="295" height="75" rx="8" fill="#0f172a"/>
  <rect class="box" x="755" y="145" width="295" height="75" rx="8" fill="rgba(120,53,15,.35)" stroke="#fbbf24"/>
  <text class="name" x="902.5" y="176">arq Worker / cron</text>
  <text class="sub" x="902.5" y="195">dispatch replay · maintenance · retries</text>

  <rect x="755" y="265" width="295" height="80" rx="8" fill="#0f172a"/>
  <rect class="box" x="755" y="265" width="295" height="80" rx="8" fill="rgba(120,53,15,.35)" stroke="#fbbf24"/>
  <text class="name" x="902.5" y="296">DDL LangGraph · 10 nodes</text>
  <text class="sub" x="902.5" y="315">sync checkpoint · interrupt / resume</text>
  <text class="sub" x="902.5" y="332">pending → running → terminal / waiting_input</text>

  <rect x="755" y="390" width="295" height="80" rx="8" fill="#0f172a"/>
  <rect class="box" x="755" y="390" width="295" height="80" rx="8" fill="rgba(6,78,59,.45)" stroke="#34d399"/>
  <text class="name" x="902.5" y="421">persist_snapshot</text>
  <text class="sub" x="902.5" y="440">DDL 工作流唯一成功出口</text>
  <text class="sub" x="902.5" y="457">Accepted Snapshot publisher</text>

  <rect x="755" y="515" width="295" height="80" rx="8" fill="#0f172a"/>
  <rect class="box" x="755" y="515" width="295" height="80" rx="8" fill="rgba(120,53,15,.35)" stroke="#fbbf24"/>
  <text class="name" x="902.5" y="546">Extraction dispatcher</text>
  <text class="sub" x="902.5" y="565">用户原话 + message UID 证据</text>
  <text class="sub" x="902.5" y="582">受控创建用户长期记忆 candidate</text>

  <rect x="755" y="635" width="295" height="80" rx="8" fill="#0f172a"/>
  <rect class="box" x="755" y="635" width="295" height="80" rx="8" fill="rgba(120,53,15,.35)" stroke="#fbbf24"/>
  <text class="name" x="902.5" y="666">Projection dispatchers</text>
  <text class="sub" x="902.5" y="685">Meta Projection · Memory Projection</text>
  <text class="sub" x="902.5" y="702">desired state / lease / retry / rebuild</text>

  <!-- CDC boxes -->
  <rect x="1140" y="205" width="140" height="80" rx="8" fill="#0f172a"/>
  <rect class="box" x="1140" y="205" width="140" height="80" rx="8" fill="rgba(251,146,60,.28)" stroke="#fb923c"/>
  <text class="name" x="1210" y="236">Binlog capture</text>
  <text class="sub" x="1210" y="255">命名源 · row events</text>
  <text class="sub" x="1210" y="272">可恢复 coordinate</text>

  <rect x="1140" y="365" width="140" height="120" rx="8" fill="#0f172a"/>
  <rect class="box" x="1140" y="365" width="140" height="120" rx="8" fill="rgba(251,146,60,.28)" stroke="#fb923c"/>
  <text class="name" x="1210" y="395">Data Sync</text>
  <text class="sub" x="1210" y="416">pending_schema</text>
  <text class="sub" x="1210" y="433">buffering · backfilling</text>
  <text class="sub" x="1210" y="450">replaying · streaming</text>
  <text class="sub" x="1210" y="469">paused / conflict / dead</text>

  <rect x="1140" y="530" width="140" height="80" rx="8" fill="#0f172a"/>
  <rect class="box" x="1140" y="530" width="140" height="80" rx="8" fill="rgba(251,146,60,.28)" stroke="#fb923c"/>
  <text class="name" x="1210" y="561">DW apply</text>
  <text class="sub" x="1210" y="580">schema · backfill</text>
  <text class="sub" x="1210" y="597">replay · streaming</text>

  <!-- storage boxes -->
  <rect x="1370" y="145" width="210" height="75" rx="8" fill="#0f172a"/>
  <rect class="box" x="1370" y="145" width="210" height="75" rx="8" fill="rgba(30,41,59,.65)" stroke="#94a3b8"/>
  <text class="name" x="1475" y="176">Redis</text>
  <text class="sub" x="1475" y="192">Job · lease · events · outbox</text>
  <text class="sub" x="1475" y="207">checkpoint · arq</text>

  <rect x="1370" y="255" width="210" height="70" rx="8" fill="#0f172a"/>
  <rect class="box" x="1370" y="255" width="210" height="70" rx="8" fill="rgba(30,41,59,.65)" stroke="#94a3b8"/>
  <text class="name" x="1475" y="284">Named Source MySQL</text>
  <text class="sub" x="1475" y="303">source schema / tables / Binlog</text>

  <rect x="1370" y="365" width="210" height="180" rx="8" fill="#0f172a"/>
  <rect class="box" x="1370" y="365" width="210" height="180" rx="8" fill="rgba(76,29,149,.48)" stroke="#a78bfa"/>
  <text class="name" x="1475" y="397">MySQL · 权威源</text>
  <text class="sub" x="1475" y="420">Meta Snapshot</text>
  <text class="sub" x="1475" y="440">Long-term Memory + history</text>
  <text class="sub" x="1475" y="460">Conversation + turn lease</text>
  <text class="sub" x="1475" y="480">Data Sync desired / state</text>
  <text class="sub" x="1475" y="500">DW unified tables</text>
  <text class="sub" x="1475" y="520">Meta / Memory projection outbox</text>

  <rect x="1370" y="590" width="210" height="95" rx="8" fill="#0f172a"/>
  <rect class="box" x="1370" y="590" width="210" height="95" rx="8" fill="rgba(76,29,149,.34)" stroke="#a78bfa"/>
  <text class="name" x="1475" y="622">Elasticsearch / Qdrant</text>
  <text class="sub" x="1475" y="642">Meta semantic / values</text>
  <text class="sub" x="1475" y="659">Memory lexical / vector</text>
  <text class="sub" x="1475" y="676">可降级 · 可重建 · 非权威</text>

  <!-- legend -->
  <g transform="translate(40 812)">
    <rect width="1560" height="56" rx="10" fill="#111827" stroke="#334155"/>
    <text x="18" y="22" fill="#cbd5e1" font-size="10" font-weight="700">图例</text>
    <line x1="66" y1="18" x2="106" y2="18" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow-cyan)"/>
    <text x="118" y="22" fill="#94a3b8" font-size="9">同步 HTTP / 前端传输</text>
    <line x1="270" y1="18" x2="310" y2="18" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)"/>
    <text x="322" y="22" fill="#94a3b8" font-size="9">应用编排 / 权威事务</text>
    <line x1="500" y1="18" x2="540" y2="18" stroke="#fb923c" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-orange)"/>
    <text x="552" y="22" fill="#94a3b8" font-size="9">异步投递 / outbox / CDC</text>
    <text x="18" y="43" fill="#94a3b8" font-size="9">边界：Chat 无 token streaming；Readiness 不查询 DW 行；Accepted Snapshot 成功后，Data Sync 与投影故障独立重试。</text>
  </g>
</svg>

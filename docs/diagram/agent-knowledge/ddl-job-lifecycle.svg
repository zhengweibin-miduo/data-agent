<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 760" role="img" aria-labelledby="title desc">
  <title id="title">DDL Metadata Job 生命周期</title><desc id="desc">DDL 预览不创建任务；提交后 Redis 原子受理，arq worker 运行十节点 LangGraph，在需要时等待人工澄清并从同步 checkpoint 恢复，最终进入六种公开状态之一。</desc>
  <defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width=".5"/></pattern><marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748b"/></marker><marker id="rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#fb7185"/></marker><style>text{font-family:"Cascadia Code","Noto Sans SC","PingFang SC",sans-serif}.title{font-size:20px;font-weight:700;fill:#f8fafc}.sub{font-size:10px;fill:#94a3b8}.head{font-size:11px;font-weight:700;fill:#f8fafc}.body{font-size:9px;fill:#cbd5e1}.tiny{font-size:8px;fill:#94a3b8}.arrow{fill:none;stroke:#64748b;stroke-width:1.5;marker-end:url(#arrow)}.error{fill:none;stroke:#fb7185;stroke-width:1.4;stroke-dasharray:5 4;marker-end:url(#rose)}</style></defs>
  <rect width="1160" height="760" fill="#0f172a"/><rect width="1160" height="760" fill="url(#grid)"/><text x="30" y="38" class="title">DDL Metadata Job：受理一次，允许暂停与恢复</text><text x="30" y="58" class="sub">Redis lease 保护同一 source；dispatch outbox 让“受理成功但立即入队失败”仍可由 cron 重放</text>
  <!-- regions -->
  <rect x="25" y="85" width="330" height="590" rx="12" fill="none" stroke="#22d3ee" stroke-dasharray="8 4"/><text x="40" y="105" class="body" fill="#22d3ee">API / Redis protocol</text>
  <rect x="390" y="85" width="500" height="590" rx="12" fill="none" stroke="#34d399" stroke-dasharray="8 4"/><text x="405" y="105" class="body" fill="#34d399">arq worker / 10-node LangGraph</text>
  <rect x="925" y="85" width="210" height="590" rx="12" fill="none" stroke="#a78bfa" stroke-dasharray="8 4"/><text x="940" y="105" class="body" fill="#a78bfa">public state / SSE</text>
  <!-- arrows first -->
  <path d="M190 170v60" class="arrow"/><path d="M190 300v60" class="arrow"/><path d="M315 395h120" class="arrow"/><path d="M560 445v45" class="arrow"/><path d="M670 525h105" class="arrow"/><path d="M775 560c0 70-335 70-335 0" class="arrow"/>
  <path d="M865 621h35V419h50" class="arrow"/><path d="M665 395h245v119h40" class="error"/><path d="M900 514v95h50" class="error"/>
  <!-- API boxes -->
  <g text-anchor="middle"><rect x="70" y="120" width="240" height="50" rx="25" fill="#0f172a"/><rect x="70" y="120" width="240" height="50" rx="25" fill="rgba(8,51,68,.5)" stroke="#22d3ee"/><text x="190" y="142" class="head">DDL preview</text><text x="190" y="157" class="tiny">确定性预览；不创建 Job</text>
  <rect x="70" y="230" width="240" height="70" rx="7" fill="#0f172a"/><rect x="70" y="230" width="240" height="70" rx="7" fill="rgba(8,51,68,.5)" stroke="#22d3ee"/><text x="190" y="252" class="head">Submit Job</text><text x="190" y="269" class="body">Lua 原子写 job + source lease</text><text x="190" y="284" class="body">+ dispatch outbox</text>
  <rect x="70" y="360" width="245" height="70" rx="7" fill="#0f172a"/><rect x="70" y="360" width="245" height="70" rx="7" fill="rgba(251,146,60,.28)" stroke="#fb923c"/><text x="192" y="382" class="head">Dispatch</text><text x="192" y="399" class="body">立即 enqueue（best effort）</text><text x="192" y="414" class="body">失败则 cron 重放 outbox</text></g>
  <!-- graph -->
  <g text-anchor="middle"><rect x="435" y="355" width="230" height="90" rx="7" fill="#0f172a"/><rect x="435" y="355" width="230" height="90" rx="7" fill="rgba(6,78,59,.48)" stroke="#34d399"/><text x="550" y="378" class="head">Graph nodes 1–5</text><text x="550" y="396" class="body">parse → load memory → classify</text><text x="550" y="412" class="body">→ validate → plan questions</text><text x="550" y="429" class="tiny">sync checkpoint 保存可恢复状态</text>
  <polygon points="550,490 670,525 550,560 430,525" fill="#0f172a"/><polygon points="550,490 670,525 550,560 430,525" fill="rgba(120,53,15,.35)" stroke="#fbbf24" stroke-width="1.5"/><text x="550" y="522" class="head">需要澄清？</text><text x="550" y="538" class="tiny">interrupt()</text>
  <rect x="775" y="490" width="115" height="70" rx="7" fill="#0f172a"/><rect x="775" y="490" width="115" height="70" rx="7" fill="rgba(120,53,15,.35)" stroke="#fbbf24"/><text x="832" y="512" class="head">人工回答</text><text x="832" y="529" class="tiny">question_set_id</text><text x="832" y="544" class="tiny">恢复同一线程</text>
  <rect x="435" y="590" width="430" height="62" rx="7" fill="#0f172a"/><rect x="435" y="590" width="430" height="62" rx="7" fill="rgba(6,78,59,.48)" stroke="#34d399"/><text x="650" y="612" class="head">Graph nodes 6–10</text><text x="650" y="630" class="body">await answers → generate/validate metrics → build candidates → persist_snapshot</text><text x="650" y="644" class="tiny">persist_snapshot 是本工作流唯一成功出口</text></g>
  <text x="688" y="514" class="tiny" fill="#fbbf24">是</text><text x="560" y="580" class="tiny" fill="#34d399">否</text>
  <text x="884" y="610" class="tiny" fill="#34d399" text-anchor="end">commit</text><text x="900" y="383" class="tiny" fill="#fb7185" text-anchor="end">validation / execution exception</text>
  <!-- states -->
  <g text-anchor="middle"><rect x="960" y="145" width="140" height="42" rx="21" fill="rgba(59,130,246,.3)" stroke="#60a5fa"/><text x="1030" y="171" class="head">pending</text><rect x="960" y="220" width="140" height="42" rx="21" fill="rgba(6,78,59,.45)" stroke="#34d399"/><text x="1030" y="246" class="head">running</text><rect x="960" y="295" width="140" height="42" rx="21" fill="rgba(120,53,15,.35)" stroke="#fbbf24"/><text x="1030" y="321" class="head">waiting_input</text><rect x="950" y="390" width="160" height="58" rx="7" fill="rgba(6,78,59,.45)" stroke="#34d399"/><text x="1030" y="416" class="head">succeeded</text><text x="1030" y="433" class="tiny">snapshot committed</text><rect x="950" y="485" width="160" height="58" rx="7" fill="rgba(136,19,55,.38)" stroke="#fb7185"/><text x="1030" y="511" class="head">rejected</text><text x="1030" y="528" class="tiny">validation rejected</text><rect x="950" y="580" width="160" height="58" rx="7" fill="rgba(136,19,55,.38)" stroke="#fb7185"/><text x="1030" y="606" class="head">failed</text><text x="1030" y="623" class="tiny">execution failure</text></g>
  <path d="M1030 187v33M1030 262v33" class="arrow"/><text x="580" y="710" class="body" text-anchor="middle">终态发布稳定业务事件并安排 checkpoint 清理；前端断线后回读权威 Job，SSE 不是任务真相来源。</text>
</svg>
